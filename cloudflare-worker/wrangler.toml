# Cloudflare Workers config for the Aizen scheduler.
# Deploy: npx wrangler deploy
# Secrets: npx wrangler secret put GITHUB_TOKEN
#
# As of late August 2026 Cloudflare's cron-trigger delivery has been
# silently failing for many accounts (community reports of triggers
# registered but never firing, no errors in logs). We have therefore
# moved scheduling to GitHub Actions: each .github/workflows/*.yml
# keeps its own `on.schedule:` block, plus .github/workflows/heartbeat.yml
# fires every 5 min as a redundant backup that POSTs to this Worker's
# HTTP endpoint. The Worker is now an HTTP-only dispatcher, not a
# scheduled one.

name = "aizen-scheduler"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cron triggers intentionally left empty: scheduling is handled by
# the GitHub Actions workflows (.github/workflows/*.yml's on.schedule
# blocks) and the heartbeat workflow (.github/workflows/heartbeat.yml).
# The [triggers] section is preserved as an empty array so a future
# re-enable is a one-line uncomment.
[triggers]
crons = [ ]

# Worker logs go to Cloudflare's logpush. Set LOG_LEVEL via wrangler:
#   npx wrangler secret put LOG_LEVEL
#   value: "info" | "debug"
#
# GITHUB_REPO must be set in the wrangler.toml [vars] block (or via
# `npx wrangler secret put GITHUB_REPO` for full secret treatment).
# We use [vars] because the repo name is not sensitive.
[vars]
GITHUB_REPO = "FreshMindAI/aizen-trading-agents"
LOG_LEVEL = "info"
