name: Aizen hourly self-analysis

# Hourly cron that reads the cycle-trace artifacts from the last
# 60 minutes (uploaded by cron-loop.yml) and produces a deterministic
# reflection report at models/reflections/{YYYY-MM-DD-HH}.md + .json.
# The report is committed back to the repo so the team can read it
# without Actions access.

on:
  schedule:
    # Top of every hour. We pick 7 minutes past (not :00) to ensure the
    # cron-loop's :00 tick has had time to upload its cycle-trace
    # artifact; the artifact is what the reflection reads.
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: aizen-hourly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reflection:
    name: Build + push reflection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIZEN_DB_PATH: ${{ github.workspace }}/data/trading.db
      AIZEN_LLM_PROVIDER: mock
      AIZEN_TRACE: '0'
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull all branches so we can push back to master.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest cycle-trace artifact
        uses: actions/download-artifact@v4
        with:
          name: cycle-trace-${{ github.event.workflow_run.id }}
          path: models/cycle_traces
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
        # The latest run may not be available (this is the first time
        # the workflow runs, or the cron-loop was skipped). Fall back
        # to whatever is on disk.

      - name: Build reflection report
        run: |
          python -m src.agents.cli.hourly_reflection \
            --out models/reflections/

      - name: Commit + push reflection to repo
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          if [ -z "$GH_PUSH_TOKEN" ]; then
            echo "GH_PUSH_TOKEN not set; skipping push (artifact still uploaded)."
            exit 0
          fi
          git config user.name "aizen-bot"
          git config user.email "aizen-bot@users.noreply.github.com"
          git add models/reflections/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          hour="$(date -u +%Y-%m-%d-%H)"
          git commit -m "reflection: ${hour}" \
            -m "Hourly self-analysis report." \
            -m "Generated by .github/workflows/hourly-analysis.yml"
          # Use inline URL with token to bypass the interactive credential
          # prompt that git push triggers in CI runners.
          git -c credential.helper= \
              push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                   "HEAD:${GITHUB_REF_NAME}"

      - name: Upload reflection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-${{ github.run_id }}
          path: |
            models/reflections/*.md
            models/reflections/*.json
          if-no-files-found: ignore
          retention-days: 30
