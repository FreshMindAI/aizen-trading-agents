name: Aizen daily P&L analysis

# Reads the last 24h of filled orders from the Alpaca paper-trading
# account, FIFO-pairs them, links each pair back to the originating
# decision_journal row via client_order_id, classifies as
# win / loss / breakeven at a $5 threshold, and upserts into the
# `decision_pnl` table. Closes the feedback loop so the orchestrator
# can learn from real outcomes.

on:
  schedule:
    # 4:30 PM ET on weekdays. GH cron uses UTC, so:
    #   ET -> UTC:  4:30 PM ET = 20:30 UTC (winter) or 20:30 UTC (summer ET)
    # We use 20:30 UTC as a single-line compromise; the run fires a
    # bit late on winter days but still well after the 4:00 PM ET
    # closing prints have settled.
    - cron: '30 20 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: aizen-daily-pnl
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pnl:
    name: Grade yesterday's fills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIZEN_DB_PATH: ${{ github.workspace }}/data/trading.db
      AIZEN_LLM_PROVIDER: mock
      AIZEN_TRACE: '0'
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily P&L
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          mkdir -p data
          python -m src.agents.cli.daily_pnl --since-hours 24

      - name: Upload decision_pnl as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-pnl-${{ github.run_id }}
          path: data/trading.db
          if-no-files-found: ignore
          retention-days: 30
