name: Aizen trading cron loop

# Runs `python -m src.agents.cli.run_loop --once` on a 15-minute
# schedule. This is the GitHub Actions alternative to a Render Cron
# Job - no payment method required, free for public repos.
#
# Setup (one time, in the GitHub repo UI):
#   1. Settings -> Secrets and variables -> Actions
#   2. Add repository secrets:
#        ALPACA_API_KEY_ID
#        ALPACA_API_SECRET_KEY
#        ANTHROPIC_AUTH_TOKEN     # primary GMI JWT
#        GMI_FALLBACK_TOKEN       # secondary GMI JWT (for bounded retry)
#        HF_TOKEN                 # HuggingFace read token (downloads models)
#   3. The Actions tab will start ticking on the cron schedule.
#      A 15-minute drift is fine; the orchestrator is point-in-time
#      aware so a late tick just runs against slightly fresher data.
#
# Manual trigger:
#   Actions -> "Aizen trading cron loop" -> "Run workflow" -> Run
#
# LLM provider:
#   Default: AIZEN_LLM_PROVIDER=mock (deterministic, free, no
#   network). To use the GMI-serving provider with primary + fallback
#   JWTs, set AIZEN_LLM_PROVIDER=gmi_fallback (already set in this
#   workflow) + ANTHROPIC_BASE_URL=https://api.gmi-serving.com.
#
# Model artifacts:
#   The cron tick downloads the latest ML + GATv2 weights from
#   HuggingFace dataset `AdithyaByri/aizen-models` (~7MB total) into
#   ./models/ before each cycle. Without this step the orchestrator
#   falls back to deterministic dummy signals and every cycle ends
#   in NO_TRADE.
#
# Cost:
#   Public repo, GitHub-hosted runner, ~30-60s per tick.
#   15-min cadence = 96 ticks/day = well under 2,000 min/month
#   free quota.

on:
  schedule:
    # 15-min cadence. GitHub's cron doesn't support */15 directly;
    # we list each quarter-hour explicitly so a missed tick on one
    # schedule line doesn't break the next.
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch: {}

# concurrency: cancel-in-progress: true  # removed: was killing in-market runs when a workflow_dispatch overlapped a schedule run

permissions:
  contents: read

jobs:
  cycle:
    name: One cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The pipeline defaults to a local SQLite path. Each tick gets
      # a fresh ephemeral runner, so this DB is wiped on every
      # invocation. The live trade journal on Alpaca's side is
      # the source of truth for what happened.
      AIZEN_DB_PATH: ${{ github.workspace }}/data/trading.db

      # ---- LLM provider ----
      # "mock" never reaches the network (deterministic, free).
      # "gmi_fallback" routes through ANTHROPIC_BASE_URL (GMI-serving)
      # with a single-step fallback swap to GMI_FALLBACK_TOKEN on
      # 401/403/429. The base URL and path are NOT secrets so they
      # live here.
      AIZEN_LLM_PROVIDER: gmi_fallback
      ANTHROPIC_BASE_URL: https://api.gmi-serving.com
      ANTHROPIC_MESSAGES_PATH: /v1/messages

      # ---- Loop config ----
      RUN_MODE: paper
      AIZEN_TRACE: '1'
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # 15Min bars on the free IEX feed (feed=iex) - works on the paper
      # account. The cron ticks on a 15-min cadence, so 15Min bars give
      # 1 fresh bar per cycle with no overlap. The ML models were
      # trained on h4=1h / h16=4h forward returns, so a 15Min feed means
      # each tick reads 4 bars of h1 forward context. Set ALPACA_FEED=sip
      # for paid real-time data.
      TIMEFRAME: '15Min'
      LOOKBACK_MINUTES: '240'   # 16 bars × 15min = 4h of intraday history
      ALPACA_FEED: 'iex'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "huggingface_hub>=0.24"

      - name: Download ML + GATv2 artifacts from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="AdithyaByri/aizen-models",
              repo_type="dataset",
              token=os.environ.get("HF_TOKEN"),
              allow_patterns=[
                  "models/*.pkl",
                  "models/*.pt",
                  "models/*.meta.json",
              ],
              local_dir=os.getcwd(),
          )
          print(f"downloaded to {path}")
          # Quick sanity check: list the artifacts that landed.
          import pathlib
          for p in sorted(pathlib.Path("models").glob("*")):
              if p.is_file() and (p.suffix in {".pkl", ".pt"} or p.suffix == ".json"):
                  print(f"  {p.name}  {p.stat().st_size} bytes")
          PY

      - name: Run one cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GMI_FALLBACK_TOKEN: ${{ secrets.GMI_FALLBACK_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p data
          # Fast gate before the cycle runs: outside US equity hours
          # (9:30-16:00 ET, weekdays, no holidays) the data refresh
          # 403s and there's nothing for the orchestrator to do.
          python -c "
          from src.agents.market_hours import evaluate
          g = evaluate()
          print(f'market-hours gate: {g}')
          if not g.should_run:
              import sys
              sys.exit(0)  # clean skip, no further work
          "
          python -m src.agents.cli.run_loop --once

      # Bug B fix: the GH Actions runner is ephemeral so the local
      # decision_journal is wiped on every invocation. After each
      # cycle, push the journal rows to a HuggingFace dataset so
      # the decisions survive runner shutdown.
      #
      # Content scope: the script redacts agent_observations_json
      # and agent_messages_json (LLM prompt/response envelopes) by
      # default - only the trading-signal JSON blobs go up. The
      # script is no-op if no new decisions have been recorded
      # since the last upload (server-side dedup via the merged
      # snapshot.jsonl).
      - name: Push decision journal to HuggingFace
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/push_journal_to_hf.py --include-llm-transcripts || echo "journal upload failed (non-fatal)"

      - name: Upload cycle trace as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-trace-${{ github.run_id }}
          path: |
            models/cycle_traces/cycle_*.jsonl
            models/cycle_traces.jsonl
          if-no-files-found: ignore
          retention-days: 14
