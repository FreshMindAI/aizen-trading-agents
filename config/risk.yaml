# Hard risk limits. Risk Agent is deterministic and authoritative: NO LLM call
# can override a REJECT. OrderIntent is reduced to approved_quantity, never
# inflated.
risk:
  # Per-trade limits
  max_leg_quantity: 10
  max_order_notional_usd: 2000.0
  max_loss_per_trade_usd: 300.0

  # Portfolio-level limits
  max_open_positions: 6
  max_concentration_per_underlying: 0.40   # 40% of gross notional
  max_gross_exposure_usd: 8000.0
  max_net_delta_per_underlying: 50.0       # shares-equivalent
  max_net_vega_per_underlying: 100.0

  # Spread / liquidity
  max_bid_ask_spread_pct: 0.15
  min_open_interest: 50
  min_option_volume: 10

  # Universe / instrument filters
  allowed_underlyings: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD]
  # Hackathon sizing: 1-week window (2026-08-28 -> 2026-09-04). The XGBoost
  # model has a 4-bar (~1h) forward horizon, so holding an option 25-60 days
  # to expiry bleeds the premium to theta before the signal can play out.
  # Aug-17 AMZN introspection: dir_prob=0.582 (BULL) but 5 calls with DTE
  # 25-60 lost $625 because AMZN was flat (262.08 -> 262.04) over 11 days
  # and theta ate the premium. DTE 5-10 keeps the trade inside the model's
  # signal-decay window.
  allowed_expiries_dte_min: 5
  allowed_expiries_dte_max: 10
  require_liquid_underlying: true

  # Equity (stock) leg limits. The parallel options+stocks path emits a
  # long-equity candidate when the directional signal is strong but the
  # option chain is empty or the score is below the option threshold.
  # Sized for a 1-week hackathon paper account: $1.5k/symbol cap avoids
  # concentrating a single name; $5k total cap leaves headroom for one
  # equity + one option leg in the same cycle.
  # NOTE: equity legs require non-margin cash. In a margin account the
  # Pattern Day Trader rule applies — 4+ day trades in 5 trading days
  # forces the $25k minimum. We are running cash (paper) so this is moot
  # for the hackathon, but documented for the future.
  max_equity_notional_per_symbol: 1500.0
  max_equity_notional_total: 5000.0
  min_equity_direction_probability: 0.55
  # Tie-breaker when both option and equity candidates clear the score
  # gate. 0.0 = options win (default; current behavior). Positive value
  # means equity is preferred when its score is this much higher than
  # the option score. Negative = options are always preferred.
  equity_preferred_when_score_margin: 0.0
