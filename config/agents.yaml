# Phase-3 agent configuration.
# Toggle individual agents, scoring weights, and decision thresholds here.
orchestrator:
  schema_version: "1.0"
  max_decisions_per_session: 1000
  cooldown_seconds: 60        # minimum interval between decisions per symbol
  loop_interval_seconds: 300  # poll interval when running in --loop mode

# Master switches: disable a specialized agent to fall back to its deterministic
# default observation. Useful during incremental rollout.
agents:
  regime:
    enabled: true
  direction:
    enabled: true
  volatility:
    enabled: true
  research:
    # Spec 003: news-driven GATv2 feature. Default OFF per the failure-analysis
    # close-out checklist row 4. The walk-forward ablation report in
    # models/ablation_option_opportunity.json is the gate; flip to true only
    # after the report's `promote_default.promote == true`. Env var override:
    # AIZEN_RESEARCH_ENABLED=true.
    enabled: false
  options_structure:
    enabled: true
  portfolio:
    enabled: true
  risk:
    enabled: true
  supervisor:
    enabled: true
  execution:
    enabled: true

# LLM provider (pluggable). 'mock' returns deterministic structured output and
# is the default for paper/dry-run. Switch to 'openai' or 'anthropic' for live
# reasoning - both require the corresponding API key in the environment.
# `base_url` and `messages_path` override the env defaults; useful for
# proxies like GMI-serving (https://api.gmi-serving.com).
llm:
  provider: mock
  # `model` is intentionally OMITTED: each provider's class default is the
  # right answer (MockProvider -> "mock-1", AnthropicProvider ->
  # ANTHROPIC_DEFAULT_MODEL = "claude-haiku-4-5-20251001", GMIFallbackProvider
  # inherits the Anthropic default). When AIZEN_LLM_PROVIDER=gmi_fallback
  # is set in the cron env, leaving `model` unset here ensures the GMI
  # endpoint receives a real model id, not the MockProvider's "mock-1"
  # sentinel (which 404s the request).
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  # base_url: https://api.gmi-serving.com
  # messages_path: /v1/messages
  # auth_token_env: ANTHROPIC_AUTH_TOKEN
  # To pin a specific model, uncomment `model:` and set it to a value
  # that the resolved provider can actually serve. e.g.:
  #   model: claude-haiku-4-5-20251001   (for provider: anthropic|gmi_fallback)

# Decision thresholds (doc section 15). A decision is fired only when an ML
# score crosses these, or a portfolio/regime event crosses the matching gate.
thresholds:
  direction_prob_min: 0.55          # require P(up) > this to be a 'long bias'
  iv_rv_gap_min: 0.05               # |predicted_iv - predicted_rv| required
  candidate_min_score: 0.30         # candidates below this are dropped
  confidence_min: 0.50              # supervisor drops low-confidence
  portfolio_review_pct: 0.50        # 50% of max exposure triggers review
  no_trade_if_disagreement: true    # agents in conflict => NO_TRADE default
  # Hackathon sizing (1-week window: 2026-08-28 -> 2026-09-04): the XGBoost
  # model is trained on a 4-bar forward horizon (~1h), so holding an option
  # 25-60 days to expiry bleeds the premium to theta before the signal can
  # play out. Tighten DTE to fit the trade window.
  dte_min: 5
  dte_max: 10                       # 1-week hackathon: 5-10 DTE only

# Candidate scoring weights (doc section 11). Sum does not need to be 1.0 -
# they enter the formula directly. Tune via walk-forward backtesting only.
scoring:
  weights:
    direction_edge: 0.30
    volatility_edge: 0.20
    option_expected_return: 0.25
    probability_profit: 0.20
    gnn_confirmation: 0.10
    news_sentiment: 0.0             # spec 003: 0.0 by default; 0.10 if ablation promotes
    spread_penalty: 0.10
    liquidity_penalty: 0.05
    portfolio_risk_penalty: 0.15
  candidate_set_size: 5             # Options Structure Agent returns top-N
  # Hackathon mandate (Alpaca AI Trading Agents Hackathon, Aug 28 -
  # Sept 4 2026): options are MANDATORY. When an option candidate is
  # in the strict DTE window (5-10) AND has a real option_h4 ML
  # prediction (not the heuristic fallback), add this fixed score
  # boost so it reliably outscores the parallel long-equity candidate.
  # Sized to overcome (a) the option leg's spread+liquidity penalties
  # vs. equity's zero penalties and (b) the option model's
  # conservative expected_return vs. equity's (dp-0.5)*2 proxy. The
  # default 0.30 is enough to outscore a typical equity candidate
  # (~0.30-0.35) by 0.05+ so the supervisor reliably picks the option
  # leg in a strict DTE window. Set to 0.0 to disable; the boost is
  # also logged on the candidate's thesis as `[mandate+0.30]`. The
  # cloud cron can override this at runtime via the
  # AIZEN_OPTION_MANDATE_BOOST env var without editing this file.
  option_mandate_boost: 0.30

# Position management (added 2026-09-02 in response to the loss-position
# audit). Pre-flight checks run at the start of every cycle BEFORE the
# graph agents fire, so a daily-loss kill-switch can short-circuit the
# cycle and a per-position stop-loss can auto-close losers before the
# model sees them. Per-symbol cooldown filters new candidates in the
# supervisor so the model does not re-enter a symbol it's already
# bleeding on. Every threshold has an env-var override so the cloud
# cron can tune without editing this file.
position_management:
  # (a) Daily loss kill-switch. If today's realized + open-position
  # unrealized P/L is worse than this fraction of capital, return
  # NO_TRADE and skip the cycle. Default -3% of capital (loosened
  # from -2% on 2026-09-03 to give the daily P/L more headroom on
  # a quiet session; per-position stop-loss catches the real losses).
  # Env: AIZEN_DAILY_LOSS_KILL_SWITCH_PCT.
  daily_loss_kill_switch_pct: -0.03
  # (b) Per-position stop-loss. Any open position whose
  # unrealized_pnl / cost_basis is worse than this is auto-closed via
  # a market order on Alpaca. Default -30% (tightened from -50% on
  # 2026-09-03 after the COIN/META loss review: fire earlier on a
  # losing leg, lock the remaining premium).
  # Env: AIZEN_STOP_LOSS_PCT.
  stop_loss_pct: -0.30
  # (b2) Profit-take. Symmetric to stop-loss: close any position
  # whose gain exceeds +pct of cost basis. Default +50% (lock in
  # option premium before decay / reversal; new on 2026-09-03).
  # Env: AIZEN_PROFIT_TAKE_PCT.
  profit_take_pct: 0.50
  # (c) Per-symbol cooldown. After a realized loss, block new entries
  # on that symbol for this many seconds. Default 24h.
  # Env: AIZEN_COOLDOWN_SECONDS.
  cooldown_seconds: 86400
  # (c-ii) While a position is open and in loss by more than this
  # fraction of cost, treat the symbol as blocked from new entries
  # (so the model does not "double down" on a losing leg). Default
  # -1% — tighter than -5% so we prevent new entries on any
  # meaningful loss, not just catastrophic ones. The
  # 2026-09-02 COIN/META loss review showed -1% on COIN equity
  # and -2.5% on COIN260911P00175000 both preceded larger losses;
  # -1% is the right cut. Env: AIZEN_OPEN_LOSS_BLOCK_PCT.
  open_loss_block_pct: -0.01
  # (c-iii) Early-warning threshold. Log a WARNING (no auto-close)
  # when a position crosses this loss fraction, halfway between
  # "safe" and the -30% stop-loss. Default -15% (added 2026-09-03
  # as part of the position-management hardening). Env:
  # AIZEN_EARLY_WARNING_PCT.
  early_warning_pct: -0.15
